name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # 必须用带 pgvector 扩展的镜像：DatabaseInitializer 会执行 CREATE EXTENSION vector
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: devmind
          POSTGRES_PASSWORD: devmind123
          POSTGRES_DB: devmind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devmind"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 后端 297 个测试：单元测试走 mock，DevMindIntegrationTest 连 CI 的 pgvector 服务
      - name: Backend tests
        run: mvn -B test

      # 前端 40 个测试
      - name: Frontend tests
        working-directory: frontend
        run: npm ci && npm test

      # 前端构建产物写入 src/main/resources/static，随后端 jar 一起打包
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Package backend jar
        run: mvn -B -DskipTests package

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 验证根 Dockerfile 可构建出镜像（多阶段：maven 构建 → JRE 运行时）
      - name: Build Docker image
        run: docker build -t devmind:ci .
