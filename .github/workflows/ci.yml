name: CI

on:
  push:
    branches: [master]
    # 纯文档/README 改动不触发 CI（单线程开发省无谓等待）
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '**/*.md'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # 必须用带 pgvector 扩展的镜像：DatabaseInitializer 会执行 CREATE EXTENSION vector
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: devmind
          POSTGRES_PASSWORD: devmind123
          POSTGRES_DB: devmind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devmind"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 后端 297 个测试：单元测试走 mock，DevMindIntegrationTest 连 CI 的 pgvector 服务
      - name: Backend tests
        run: mvn -B test

      # 前端 40 个测试
      - name: Frontend tests
        working-directory: frontend
        run: npm ci && npm test

      # 前端构建产物写入 src/main/resources/static，随后端 jar 一起打包
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Package backend jar
        run: mvn -B -DskipTests package

  # docker 与 test 并行：docker 是独立的多阶段构建（不消费 test 产物），
  # 无需串行等待 test，总耗时从 ~3.5min 降到 ~1.8min
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 验证根 Dockerfile 可构建出镜像（多阶段：maven 构建 → JRE 运行时）。
      # type=gha 缓存：pom.xml/Dockerfile 未变时依赖下载与编译层跨 run 复用，
      # 避免每次 push 都重新下载全部 Maven 依赖（docker job 从 ~10min 降到 ~1-2min）。
      - name: Build Docker image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: devmind:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
