# 应用通用环境变量（app / app2 共享）
x-app-env: &app-env
  SPRING_PROFILES_ACTIVE: ${DEVMIND_PROFILE:-mock}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-devmind}
  POSTGRES_USER: ${POSTGRES_USER:-devmind}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devmind123}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-devmind-local}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
  OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
  OPENAI_MAX_TOKENS: ${OPENAI_MAX_TOKENS:-2000}
  OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
  DEVMIND_EMBEDDING_DIMENSIONS: ${DEVMIND_EMBEDDING_DIMENSIONS:-1536}
  DEVMIND_CHUNKER_STRATEGY: ${DEVMIND_CHUNKER_STRATEGY:-boundary}
  DEVMIND_MODEL_MODE: ${DEVMIND_MODEL_MODE:-mock}
  DEVMIND_TASK_QUEUE_MODE: ${DEVMIND_TASK_QUEUE_MODE:-redis}
  DEVMIND_STATE_STORE: ${DEVMIND_STATE_STORE:-redis}
  SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:-redis}
  SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT:-6379}
  DEVMIND_EMBEDDING_FALLBACK_BASE_URL: ${DEVMIND_EMBEDDING_FALLBACK_BASE_URL:-}
  DEVMIND_EMBEDDING_FALLBACK_API_KEY: ${DEVMIND_EMBEDDING_FALLBACK_API_KEY:-}
  DEVMIND_EMBEDDING_FALLBACK_MODEL: ${DEVMIND_EMBEDDING_FALLBACK_MODEL:-BAAI/bge-m3}
  DEVMIND_SQL_DIAGNOSIS_MODE: ${DEVMIND_SQL_DIAGNOSIS_MODE:-mock}
  DEVMIND_SQL_JDBC_URL: ${DEVMIND_SQL_JDBC_URL:-}
  DEVMIND_SQL_USERNAME: ${DEVMIND_SQL_USERNAME:-}
  DEVMIND_SQL_PASSWORD: ${DEVMIND_SQL_PASSWORD:-}
  DEVMIND_MODEL_FALLBACK_BASE_URL: ${DEVMIND_MODEL_FALLBACK_BASE_URL:-}
  DEVMIND_MODEL_FALLBACK_API_KEY: ${DEVMIND_MODEL_FALLBACK_API_KEY:-}
  DEVMIND_MODEL_FALLBACK_CHAT_MODEL: ${DEVMIND_MODEL_FALLBACK_CHAT_MODEL:-}
  # 第二备用模型（DeepSeek 官方等国内直连，插在主渠道与 OpenRouter 之间）
  DEVMIND_MODEL_FALLBACK2_BASE_URL: ${DEVMIND_MODEL_FALLBACK2_BASE_URL:-}
  DEVMIND_MODEL_FALLBACK2_API_KEY: ${DEVMIND_MODEL_FALLBACK2_API_KEY:-}
  DEVMIND_MODEL_FALLBACK2_CHAT_MODEL: ${DEVMIND_MODEL_FALLBACK2_CHAT_MODEL:-}
  # 模型主渠道（2026-08-14 起优先硅基流动 DeepSeek，替代易限流的智谱免费模型）：
  # zhipu 命名保留（OpenAI 兼容网关），实际指向硅基流动 /v1 兼容端点
  DEVMIND_ZHIPU_BASE_URL: ${DEVMIND_ZHIPU_BASE_URL:-https://api.siliconflow.cn/v1}
  DEVMIND_ZHIPU_API_KEY: ${DEVMIND_ZHIPU_API_KEY:-}
  DEVMIND_ZHIPU_CHAT_MODEL: ${DEVMIND_ZHIPU_CHAT_MODEL:-deepseek-ai/DeepSeek-V4-Flash}
  DEVMIND_ZHIPU_EMBEDDING_MODEL: ${DEVMIND_ZHIPU_EMBEDDING_MODEL:-BAAI/bge-m3}
  DEVMIND_ZHIPU_MAX_TOKENS: ${DEVMIND_ZHIPU_MAX_TOKENS:-2000}
  DEVMIND_AUTH_ENABLED: ${DEVMIND_AUTH_ENABLED:-false}
  DEVMIND_OTLP_ENDPOINT: ${DEVMIND_OTLP_ENDPOINT:-http://tempo:4318/v1/traces}
  LOG_PATH: /app/logs
  LOG_FILE: devmind.log

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: devmind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: devmind
      POSTGRES_USER: devmind
      POSTGRES_PASSWORD: devmind123
    ports:
      - "5432:5432"
    volumes:
      - devmind-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devmind -d devmind"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: devmind-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - devmind-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: devmind-app
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
      LOG_FILE: app.log
      # JVM 堆上限（默认按宿主 25% 会到 ~8GB，多容器共存易挤爆内存；1.5G 对当前负载充裕）
      JAVA_TOOL_OPTIONS: -Xmx1536m
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    # 应用健康检查（SRE）：探测 Spring Boot Actuator /actuator/health，
    # node 为 MCP 依赖已随镜像安装（v22 含全局 fetch）
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8080/actuator/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  # 第二个实例：验证 Redis Stream 消费者组多实例负载均衡 / 水平扩展
  app2:
    build: .
    container_name: devmind-app2
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
      SERVER_PORT: "8081"
      LOG_FILE: app2.log
      JAVA_TOOL_OPTIONS: -Xmx1536m
    ports:
      - "8081:8081"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8081/actuator/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  nginx:
    image: nginx:alpine
    container_name: devmind-nginx
    profiles: ["nginx"]
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro

  prometheus:
    image: prom/prometheus:latest
    container_name: devmind-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
    depends_on:
      - app

  tempo:
    image: grafana/tempo:latest
    container_name: devmind-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro

  loki:
    image: grafana/loki:latest
    container_name: devmind-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:latest
    container_name: devmind-promtail
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail.yaml"]
    volumes:
      - ./logs:/var/log/devmind
      - ./promtail:/etc/promtail:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    container_name: devmind-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin123}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  devmind-pgdata:
  devmind-redisdata:
