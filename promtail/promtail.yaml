# DevMind promtail 配置：采集应用日志到 Loki
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: devmind
    static_configs:
      - targets:
          - localhost
        labels:
          job: devmind
          __path__: /var/log/devmind/*.log
