spring:
  application:
    name: devmind
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:devmind}
    username: ${POSTGRES_USER:devmind}
    password: ${POSTGRES_PASSWORD:devmind123}
    hikari:
      maximum-pool-size: ${DEVMIND_DB_MAX_POOL_SIZE:20}
  servlet:
    multipart:
      max-file-size: ${DEVMIND_MAX_FILE_SIZE_MB:20}MB
      max-request-size: ${DEVMIND_MAX_FILE_SIZE_MB:20}MB
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 5s
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:devmind-local}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
          temperature: 0.2
          max-tokens: ${OPENAI_MAX_TOKENS:2000}
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    model:
      chat: openai
      embedding: openai

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${DEVMIND_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

devmind:
  model-mode: ${DEVMIND_MODEL_MODE:openai}
  storage-path: ${DEVMIND_STORAGE_PATH:./data/files}
  max-file-size-mb: ${DEVMIND_MAX_FILE_SIZE_MB:20}
  allowed-file-types: md,markdown,pdf
  max-chunk-chars: ${DEVMIND_MAX_CHUNK_CHARS:1500}
  overlap-chars: ${DEVMIND_OVERLAP_CHARS:200}
  chunker-strategy: ${DEVMIND_CHUNKER_STRATEGY:boundary}
  embedding-dimensions: ${DEVMIND_EMBEDDING_DIMENSIONS:1536}
  retrieval-top-k: 5
  retrieval-max-top-k: 10
  # 混合检索权重：修复向量空间一致性（bge-m3 灌库+查询）后，向量检索质量显著提升，
  # alpha 扫描最优 vectorWeight=0.9（KB19 MRR 1.0 / KB20 0.9821），向量主导、关键词兜底
  retrieval-vector-weight: ${DEVMIND_RETRIEVAL_VECTOR_WEIGHT:0.9}
  retrieval-keyword-weight: ${DEVMIND_RETRIEVAL_KEYWORD_WEIGHT:0.1}
  # minScore 按合并后（权重缩放后）分数过滤：0.35 是旧"未缩放分数"设计，与 0.9/0.4 缩放不匹配，
  # 会导致高相似度向量 chunk（如 0.68）被 0.4×0.68=0.27 < 0.35 滤掉 → chat 空/弱回答。
  # 0.15 折中：向量主导(0.9)下相似度>0.17 通过，keyword-first(0.4)下相似度>0.375 通过
  retrieval-min-score: ${DEVMIND_RETRIEVAL_MIN_SCORE:0.15}
  retrieval-hybrid-enabled: ${DEVMIND_RETRIEVAL_HYBRID_ENABLED:true}
  task-thread-pool-size: ${DEVMIND_TASK_THREAD_POOL_SIZE:4}
  task-max-retries: ${DEVMIND_TASK_MAX_RETRIES:3}
  task-retry-delay-ms: ${DEVMIND_TASK_RETRY_DELAY_MS:5000}
  task-timeout-minutes: ${DEVMIND_TASK_TIMEOUT_MINUTES:5}
  task-queue:
    # redis = Redis Stream 消费者组（多实例负载均衡）；memory = 内存线程池（默认，无 Redis 兜底）
    mode: ${DEVMIND_TASK_QUEUE_MODE:memory}
  # 本地状态存储（限流计数/熔断状态）：redis = 多实例共享；memory = JVM 本地（默认）
  state-store: ${DEVMIND_STATE_STORE:memory}
  # 备用 embedding（如硅基流动 bge-m3）：主 embedding 失败时自动切换，需与主模型维度一致（1024 维）
  embedding-fallback:
    base-url: ${DEVMIND_EMBEDDING_FALLBACK_BASE_URL:}
    api-key: ${DEVMIND_EMBEDDING_FALLBACK_API_KEY:}
    model: ${DEVMIND_EMBEDDING_FALLBACK_MODEL:BAAI/bge-m3}
  task-scan-interval-ms: ${DEVMIND_TASK_SCAN_INTERVAL_MS:60000}
  task-scan-initial-delay-ms: ${DEVMIND_TASK_SCAN_INITIAL_DELAY_MS:60000}
  sql-diagnosis-mode: ${DEVMIND_SQL_DIAGNOSIS_MODE:mock}
  sql-diagnosis-datasource-type: ${DEVMIND_SQL_DATASOURCE_TYPE:mysql}
  sql-diagnosis-jdbc-url: ${DEVMIND_SQL_JDBC_URL:}
  sql-diagnosis-username: ${DEVMIND_SQL_USERNAME:}
  sql-diagnosis-password: ${DEVMIND_SQL_PASSWORD:}
  sql-diagnosis-max-sql-length: ${DEVMIND_SQL_MAX_LENGTH:2000}
  rerank-mode: ${DEVMIND_RERANK_MODE:heuristic}
  evaluation-top-k: ${DEVMIND_EVALUATION_TOP_K:5}
  # MCP 接入安全（P3-1）：stdio 命令白名单，登记/执行 stdio MCP Server 时校验命令与参数
  mcp:
    allowed-commands: ${DEVMIND_MCP_ALLOWED_COMMANDS:npx,node,python,python3,uvx,docker}
  local-rag-fallback: ${DEVMIND_LOCAL_RAG_FALLBACK:true}
  cost-prompt-per-1k: ${DEVMIND_COST_PROMPT_PER_1K:0.00015}
  cost-completion-per-1k: ${DEVMIND_COST_COMPLETION_PER_1K:0.0006}
  model-fallback-base-url: ${DEVMIND_MODEL_FALLBACK_BASE_URL:}
  model-fallback-api-key: ${DEVMIND_MODEL_FALLBACK_API_KEY:}
  model-fallback-chat-model: ${DEVMIND_MODEL_FALLBACK_CHAT_MODEL:}
  model-fallback-2-base-url: ${DEVMIND_MODEL_FALLBACK2_BASE_URL:}
  model-fallback-2-api-key: ${DEVMIND_MODEL_FALLBACK2_API_KEY:}
  model-fallback-2-chat-model: ${DEVMIND_MODEL_FALLBACK2_CHAT_MODEL:}
  zhipu-base-url: ${DEVMIND_ZHIPU_BASE_URL:}
  zhipu-api-key: ${DEVMIND_ZHIPU_API_KEY:}
  zhipu-chat-model: ${DEVMIND_ZHIPU_CHAT_MODEL:glm-4.7-flash}
  zhipu-embedding-model: ${DEVMIND_ZHIPU_EMBEDDING_MODEL:embedding-2}
  zhipu-max-tokens: ${DEVMIND_ZHIPU_MAX_TOKENS:2000}
  auth-enabled: ${DEVMIND_AUTH_ENABLED:false}
  quota:
    daily-calls-limit: ${DEVMIND_QUOTA_DAILY_CALLS:0}
    daily-cost-limit: ${DEVMIND_QUOTA_DAILY_COST:0}
  security:
    login-max-failures: ${DEVMIND_LOGIN_MAX_FAILURES:5}
    login-lock-minutes: ${DEVMIND_LOGIN_LOCK_MINUTES:10}
    rate-limit-per-minute: ${DEVMIND_RATE_LIMIT_PER_MINUTE:120}
    rate-limit-login-per-minute: ${DEVMIND_RATE_LIMIT_LOGIN_PER_MINUTE:10}
    token-ttl-days: ${DEVMIND_TOKEN_TTL_DAYS:7}
    token-refresh-threshold-days: ${DEVMIND_TOKEN_REFRESH_THRESHOLD_DAYS:2}
    master-key: ${DEVMIND_SECRET_MASTER_KEY:}
